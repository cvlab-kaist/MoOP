# @package _global_
# Paired topology for Alpamayo 1.5 eval: driver on its own GPU, renderer+physics
# on a second GPU. GPU indices are overridden per run on the CLI
# (services.driver.gpus=[N], services.renderer.gpus=[M], ...) so parallel runs
# land on distinct cards.

defines:
  nre_cache_size: 3 # renderer.n_concurrent_rollouts + 1

trafficsim:
  server:
    max_workers: 4

services:
  renderer:
    replicas_per_container: 1
    gpus: [2]

  driver:
    replicas_per_container: 1
    gpus: [4]

  physics:
    replicas_per_container: 1
    gpus: [2]

  trafficsim:
    replicas_per_container: 1
    gpus: [2]

  controller:
    replicas_per_container: 1
    gpus: null

runtime:
  nr_workers: 2
  endpoints:
    # Total capacity per service = nr_gpus x replicas_per_container x n_concurrent_rollouts
    # REND: 1 x 1 x 2 = 2
    # DRIV: 1 x 1 x 2 = 2 (max_batch_size 1; overlaps render of B with inference of A)
    # PHYS: 1 x 1 x 2 = 2
    renderer:
      n_concurrent_rollouts: 2
    driver:
      n_concurrent_rollouts: 2
    physics:
      n_concurrent_rollouts: 2
      skip: false
    controller:
      n_concurrent_rollouts: 2
    trafficsim:
      n_concurrent_rollouts: 2
